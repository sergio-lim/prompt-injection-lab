[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-lab"
version = "1.0.0"
description = "Offline prompt-injection laboratory with simulated tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
